openapi: 3.0.3
info:
  title: Mining Production Tracking API
  version: 1.0.0
  description: 'API for digital shift production tracking: master data, machine activation,
    production entries, breakdowns, and manager dashboards.'
paths:
  /api/audit-log/:
    get:
      operationId: api_audit_log_list
      description: |-
        Applied to viewsets to enforce site/section RBAC scoping at the
        queryset level (in addition to any object-level permission classes).

        Subclasses set:
          site_lookup    - ORM lookup path from the model to Site's id,
                            e.g. "site_id" or "section__site_id".
          section_lookup - optional ORM lookup path to Section's id, used to
                            further narrow results for users restricted to
                            specific sections (e.g. a Supervisor).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: content_type
        schema:
          type: integer
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: site
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit-log/{id}/:
    get:
      operationId: api_audit_log_retrieve
      description: |-
        Applied to viewsets to enforce site/section RBAC scoping at the
        queryset level (in addition to any object-level permission classes).

        Subclasses set:
          site_lookup    - ORM lookup path from the model to Site's id,
                            e.g. "site_id" or "section__site_id".
          section_lookup - optional ORM lookup path to Section's id, used to
                            further narrow results for users restricted to
                            specific sections (e.g. a Supervisor).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: api_auth_change_password_create
      description: |-
        Every authenticated user — Admin, Supervisor, Operator —
        may change their own password here, current-password-verified. This is
        distinct from UserViewSet.reset_password (Admin-only, no current
        password needed, for resetting someone else's forgotten password).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
