  /api/breakdown-incidents/:
    get:
      operationId: api_breakdown_incidents_list
      description: |-
        Not SiteScopedOrOwnQuerySetMixin — that mixin ORs in a single owner
        field, but a BreakdownIncident has *two* legitimate non-site-access
        reasons to be visible: the reporting operator (who may hold no
        UserSiteAccess at all, same as any operator) AND the assigned artisan
        (who likewise typically holds none and isn't the reporter). Both are
        handled explicitly below.
      parameters:
      - in: query
        name: artisan
        schema:
          type: integer
      - in: query
        name: crusher
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: shift_instance
        schema:
          type: integer
      - in: query
        name: site
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_progress
          - open
          - resolved
        description: |-
          * `open` - Open
          * `in_progress` - In Progress
          * `resolved` - Resolved
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBreakdownIncidentList'
          description: ''
