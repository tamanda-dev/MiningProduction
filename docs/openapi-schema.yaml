  /api/breakdown-logs/:
    get:
      operationId: api_breakdown_logs_list
      description: |-
        Offline-sync contract: the mobile app POSTs a batch of locally-queued
        entries (each carrying a client-generated `client_uuid`) and gets back a
        per-item success/failure array, so it only needs to requeue the items
        that failed. Idempotent on `client_uuid` — a retried item updates its
        prior attempt instead of duplicating it.
      parameters:
      - in: query
        name: machine
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reason_code
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: section
        schema:
          type: integer
      - in: query
        name: shift_instance
        schema:
          type: integer
      - in: query
        name: site
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - corrected
          - flagged
          - submitted
        description: |-
          * `submitted` - Submitted
          * `flagged` - Flagged
          * `corrected` - Corrected
          * `approved` - Approved
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBreakdownLogList'
