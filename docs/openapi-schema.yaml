components:
  schemas:
    ActVsPlanRow:
      type: object
      properties:
        section:
          type: integer
        section_name:
          type: string
        parameter:
          type: integer
        parameter_code:
          type: string
        parameter_name:
          type: string
        uom:
          type: string
          nullable: true
        act:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        plan:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        var:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        pct_var:
          type: number
          format: double
          nullable: true
      required:
      - act
      - parameter
      - parameter_code
      - parameter_name
      - pct_var
      - plan
      - section
      - section_name
      - uom
      - var
    AggregationEnum:
      enum:
      - sum
      - average
      type: string
      description: |-
        * `sum` - Sum
        * `average` - Average
    AuditLog:
