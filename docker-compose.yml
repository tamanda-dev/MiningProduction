services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mining_production}
      POSTGRES_USER: ${POSTGRES_USER:-mining}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mining}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mining}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mining}:${POSTGRES_PASSWORD:-mining}@postgres:5432/${POSTGRES_DB:-mining_production}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  celery-worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    entrypoint: ["docker/celery-entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mining}:${POSTGRES_PASSWORD:-mining}@postgres:5432/${POSTGRES_DB:-mining_production}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard/src:/app/src
    depends_on:
      - backend

  celery-beat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    entrypoint: ["docker/celery-entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mining}:${POSTGRES_PASSWORD:-mining}@postgres:5432/${POSTGRES_DB:-mining_production}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  static_data:
  media_data:
