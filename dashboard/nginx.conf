server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browsers probe these paths directly regardless of index.html's <link
    # rel="icon">, which only has favicon.png — alias them instead of
    # falling through to try_files' /index.html and 404ing on the asset.
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.png;
        access_log off;
    }

    location = /favicon.svg {
        alias /usr/share/nginx/html/favicon.png;
        access_log off;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
